# adhealth-agent settings. Copy to settings.yaml and adjust.
# SECRETS NEVER GO IN THIS FILE - only the NAMES of environment variables that hold them.
# Relative paths resolve against this file's folder.

# Where finished bundles land (the collector's -OutputPath, or wherever your sync automation copies them).
# Only folders containing manifest.json are read; '.staging' is ignored.
inbox: "../../samples"            # e.g. "\\\\fs01\\ADHealth$\\inbox" or "/mnt/adhealth/inbox"
state_db: "../state/adhealth.sqlite"
outbox: "../outbox"               # dry-run payloads + undelivered alerts are written here
dry_run: true                     # flip to false only after reviewing outbox payloads in a pilot
max_file_bytes: 52428800          # per-file cap when verifying bundles (50 MB)
policy_file: "policy.yaml"

llm:
  provider: none                  # none | anthropic | bedrock  (none = deterministic template narrative)
  model_id: claude-opus-5         # Anthropic API model id; for bedrock use your Bedrock model/inference-profile id
  max_tokens: 16000
  server_side_fallbacks: true     # Anthropic API only: server-side refusal fallback
  bedrock_region: ""              # e.g. us-east-1 (bedrock only)
  include_names: false            # keep account names out of LLM prompts

teams:
  urgent_webhook_env: ADHEALTH_TEAMS_URGENT_WEBHOOK   # Workflows "When a Teams webhook request is received" URL
  digest_webhook_env: ADHEALTH_TEAMS_DIGEST_WEBHOOK
  report_link_base: ""            # e.g. https://contoso.sharepoint.com/sites/IdentityOps/Shared%20Documents/ADHealth

sharepoint:
  enabled: false
  tenant_id_env: ADHEALTH_GRAPH_TENANT_ID
  client_id_env: ADHEALTH_GRAPH_CLIENT_ID
  cert_path_env: ADHEALTH_GRAPH_CERT_PATH             # PEM private key (preferred credential)
  cert_thumbprint_env: ADHEALTH_GRAPH_CERT_THUMBPRINT
  client_secret_env: ADHEALTH_GRAPH_CLIENT_SECRET     # fallback only
  site_id: ""                     # Graph site id: contoso.sharepoint.com,<siteGuid>,<webGuid>
  folder: "ADHealth"
