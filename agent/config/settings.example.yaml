# adhealth-agent settings. Copy to settings.yaml and adjust.
# SECRETS NEVER GO IN THIS FILE - only the NAMES of environment variables that hold them.
# Relative paths resolve against this file's folder.

# Where finished bundles land (the collector's -OutputPath, or wherever your sync automation copies them).
# Only folders containing manifest.json are read; '.staging' is ignored.
inbox: "../../samples"            # e.g. "\\\\fs01\\ADHealth$\\inbox" or "/mnt/adhealth/inbox"
state_db: "../state/adhealth.sqlite"
outbox: "../outbox"               # dry-run payloads + undelivered alerts are written here
dry_run: true                     # flip to false only after reviewing outbox payloads in a pilot
max_file_bytes: 52428800          # per-file cap when verifying bundles (50 MB)
policy_file: "policy.yaml"

llm:
  # Model-agnostic: Strands Agents is the framework; the model is configuration. Approved provider: Amazon Bedrock
  # (any Bedrock model - Anthropic, Amazon Nova, Meta, Mistral, ...). Run `adhealth-agent qualify` before changing
  # model_id or mode and attach the evidence to the change record.
  # Only sanitized counts/titles/targets are sent - no account names. Model errors -> template fallback.
  # Config errors (missing model id/region) fail loudly at startup - no silent default model or region.
  provider: bedrock               # bedrock | none   (use none for a dry-run pilot before Bedrock access is approved)
  model_id: ""                    # REQUIRED: approved Bedrock model id / inference profile id / ARN from your platform team
  mode: agent                     # agent (model calls read-only tools) | single_shot (data inlined; for models without tool use)
  bedrock_region: ""              # REQUIRED: approved region, e.g. us-east-1
  bedrock_endpoint_url: ""        # optional: PrivateLink endpoint, e.g. https://vpce-xxxx.bedrock-runtime.us-east-1.vpce.amazonaws.com
  bedrock_guardrail_id: ""        # optional: Bedrock Guardrail id (set version too)
  bedrock_guardrail_version: ""
  max_tokens: 4096
  temperature: null               # null = model default
  request_timeout_seconds: 120
  max_attempts: 3                 # adaptive retries on throttling
  include_names: false            # keep account names out of LLM prompts

# Bundle authenticity. The collector signs manifest.json with -SigningCertificateThumbprint; pin that thumbprint here.
# List two thumbprints during certificate rotation. Turn require_signature on once the collector signs.
integrity:
  require_signature: false
  trusted_signer_thumbprints: []  # e.g. ["A95D2B124FE09F51076410FF42BAEBDC4BE4497B"]

teams:
  urgent_webhook_env: ADHEALTH_TEAMS_URGENT_WEBHOOK   # Workflows "When a Teams webhook request is received" URL
  digest_webhook_env: ADHEALTH_TEAMS_DIGEST_WEBHOOK
  report_link_base: ""            # e.g. https://contoso.sharepoint.com/sites/IdentityOps/Shared%20Documents/ADHealth

sharepoint:
  enabled: false
  tenant_id_env: ADHEALTH_GRAPH_TENANT_ID
  client_id_env: ADHEALTH_GRAPH_CLIENT_ID
  cert_path_env: ADHEALTH_GRAPH_CERT_PATH             # PEM private key (preferred credential)
  cert_thumbprint_env: ADHEALTH_GRAPH_CERT_THUMBPRINT
  client_secret_env: ADHEALTH_GRAPH_CLIENT_SECRET     # fallback only
  site_id: ""                     # Graph site id: contoso.sharepoint.com,<siteGuid>,<webGuid>
  folder: "ADHealth"
