[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adhealth-agent"
version = "1.0.0"
description = "Triage agent for AD forest health report bundles: verify, diff, alert (Teams), publish (SharePoint), narrate (Strands Agents; model-agnostic)."
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "requests>=2.31",
    "cryptography>=41",  # manifest signature verification
]

[project.optional-dependencies]
# LLM narrative via Strands Agents; Amazon Bedrock is the approved provider (any Bedrock model).
llm = ["strands-agents>=1.10", "boto3>=1.34"]
# SharePoint publishing via Microsoft Graph (app-only, Sites.Selected).
graph = ["msal>=1.28"]
dev = ["pytest>=8", "jsonschema>=4.21"]

[project.scripts]
adhealth-agent = "adhealth_agent.cli:main"

[tool.setuptools.packages.find]
include = ["adhealth_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
